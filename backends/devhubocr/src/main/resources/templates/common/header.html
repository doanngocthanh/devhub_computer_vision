<!-- Navigation Bar Fragment -->
<!-- header.html: only contains the header fragment (no html/head/body wrappers) -->

<header th:fragment="header" xmlns:th="http://www.thymeleaf.org" class="navbar navbar-expand-md d-print-none">
    <link rel="stylesheet" th:href="@{/css/tabler-icons.min.css}" />
    <div class="container-xl">
        <!-- BEGIN NAVBAR TOGGLER -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu"
            aria-controls="#navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- END NAVBAR TOGGLER -->
        <!-- BEGIN NAVBAR LOGO -->
        <div class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
            <a href="." aria-label="Tabler"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" width="32"
                    height="32" aria-label="Tabler" class="navbar-brand-image me-3">
                    <path
                        d="M64.6 16.2C63 9.9 58.1 5 51.8 3.4 40 1.5 28 1.5 16.2 3.4 9.9 5 5 9.9 3.4 16.2 1.5 28 1.5 40 3.4 51.8 5 58.1 9.9 63 16.2 64.6c11.8 1.9 23.8 1.9 35.6 0C58.1 63 63 58.1 64.6 51.8c1.9-11.8 1.9-23.8 0-35.6zM33.3 36.3c-2.8 4.4-6.6 8.2-11.1 11-1.5.9-3.3.9-4.8.1s-2.4-2.3-2.5-4c0-1.7.9-3.3 2.4-4.1 2.3-1.4 4.4-3.2 6.1-5.3-1.8-2.1-3.8-3.8-6.1-5.3-2.3-1.3-3-4.2-1.7-6.4s4.3-2.9 6.5-1.6c4.5 2.8 8.2 6.5 11.1 10.9 1 1.4 1 3.3.1 4.7zM49.2 46H37.8c-2.1 0-3.8-1-3.8-3s1.7-3 3.8-3h11.4c2.1 0 3.8 1 3.8 3s-1.7 3-3.8 3z"
                        fill="#066fd1" style="fill: var(--tblr-primary, #066fd1)"></path>
                </svg>Dashboard</a>
        </div>
        <!-- END NAVBAR LOGO -->
        <div class="navbar-nav flex-row order-md-last">
            <div class="nav-item d-none d-md-flex me-3">
                <div class="btn-list">
                    <!-- If not authenticated show Sign in / Register -->
            
                    <div th:if="${currentUser == null}">
                        <a th:href="@{/auth/sign-in}" class="btn btn-5">
                            <i class="fa fa-sign-in" aria-hidden="true"></i>&nbsp;
                            Đăng Nhập
                        </a>
                        <a th:href="@{/auth/sign-up}" class="btn btn-6">
                            <i class="fa fa-user-plus" aria-hidden="true"></i>&nbsp;
                            Đăng Ký
                        </a>
                    </div>
                </div>
            </div>
            <div class="d-none d-md-flex">
                
                <div class="nav-item dropdown d-none d-md-flex">
                    <a href="#" class="nav-link px-0" data-bs-toggle="dropdown" tabindex="-1"
                        aria-label="Show notifications" data-bs-auto-close="outside" aria-expanded="false"
                        th:attr="data-user-id=${currentUser != null ? currentUser.id : ''}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-1">
                            <path
                                d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6">
                            </path>
                            <path d="M9 17v1a3 3 0 0 0 6 0v-1"></path>
                        </svg>
                        <!-- Badge: show count when > 0 to match Tabler badge style -->
                        <span th:if="${notificationCount != null and notificationCount > 0}" class="badge bg-red"
                            th:text="${notificationCount}"></span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-arrow dropdown-menu-end dropdown-menu-card">
                        <div class="card">
                            <div class="card-header d-flex">
                                <h3 class="card-title">Notifications</h3>
                                <div class="btn-close ms-auto" data-bs-dismiss="dropdown"></div>
                            </div>
                            <div class="list-group list-group-flush list-group-hoverable">
                                <div class="list-group-item">
                                    <div class="row align-items-center">
                                        <div class="col-auto"><span
                                                class="status-dot status-dot-animated bg-red d-block"></span></div>
                                        <div class="col text-truncate"><a href="#" class="text-body d-block">Example
                                                1</a>
                                            <div class="d-block text-secondary text-truncate mt-n1">Change deprecated
                                                html tags to text decoration classes (#29604)</div>
                                        </div>
                                        <div class="col-auto"><a href="#" class="list-group-item-actions"><svg
                                                    xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                    class="icon text-muted icon-2">
                                                    <path
                                                        d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z">
                                                    </path>
                                                </svg></a></div>
                                    </div>
                                </div>
                                <!-- more items omitted for brevity -->
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col"><a href="#" class="btn btn-2 w-100"> Archive all </a></div>
                                    <div class="col"><a href="#" class="btn btn-2 w-100"> Mark all as read </a></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="nav-item dropdown">
                    <!-- When user is authenticated show avatar + menu -->
                    <div th:if="${currentUser != null}">
                        <a href="#" class="nav-link d-flex lh-1 p-0 px-2" data-bs-toggle="dropdown"
                            aria-label="Open user menu">
                            <span class="avatar avatar-sm bg-gray"
                                th:text="${(currentUser.displayName != null and !#strings.isEmpty(currentUser.displayName)) ? #strings.substring(currentUser.displayName,0,1) : (currentUser.email != null and !#strings.isEmpty(currentUser.email) ? #strings.substring(currentUser.email,0,1) : 'U')}">U</span>
                            <div class="d-none d-xl-block ps-2">
                                <div
                                    th:text="${currentUser.displayName != null ? currentUser.displayName : currentUser.email}">
                                    User</div>
                                <div class="mt-1 small text-secondary"
                                    th:text="${(currentUser.roles != null and !#lists.isEmpty(currentUser.roles)) ? currentUser.roles.iterator().next() : ''}">
                                </div>
                            </div>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                            <a th:href="@{/FM/A0/FMA0_0100/}" class="dropdown-item">Profile</a>
                            <div class="dropdown-divider"></div>
                            <form action="/auth/logout" method="post">
                                <button type="submit" class="dropdown-item w-100 text-start">Logout</button>
                            </form>
                        </div>
                    </div>

                    <!-- When not authenticated show sign-in / register links -->
                    <div th:unless="${currentUser != null}">
                        <a href="#" class="nav-link d-flex lh-1 p-0 px-2" data-bs-toggle="dropdown"
                            aria-label="Open user menu">
                            <span class="avatar avatar-sm bg-gray" aria-hidden="true">
                                <i class="fa fa-user" aria-hidden="true"></i>
                            </span>

                        </a>
                        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                            <a th:href="@{/auth/sign-in}" class="dropdown-item">Sign in</a>
                            <a th:href="@{/auth/register}" class="dropdown-item">Register</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        try {
            var bellToggle = document.querySelector('a[aria-label="Show notifications"]');
            if (!bellToggle) return;
            var dropdown = bellToggle.closest('.nav-item.dropdown');
            if (!dropdown) return;
            // Use periodic polling for notifications instead of SSE (more robust behind proxies)
            try {
                var streamUid = bellToggle.getAttribute('data-user-id');
                if (streamUid && streamUid !== '') {
                    // Polling function: fetch notifications list and update badge count
                    async function pollNotifications() {
                        try {
                            var url = '/AA/A0/AAA0_0104/notify';
                            url += '?userId=' + encodeURIComponent(streamUid);
                            var res = await fetch(url, { credentials: 'same-origin' });
                            if (!res.ok) return;
                            var items = await res.json();
                            var unread = 0;
                            if (items && items.length) {
                                for (var i = 0; i < items.length; i++) {
                                    var it = items[i];
                                    if (it && (it.is_read == 0 || it.is_read === false || it.is_read === '0')) unread++;
                                }
                            }
                            var badge = bellToggle.querySelector('.badge');
                            if (unread > 0) {
                                if (badge) {
                                    badge.textContent = String(unread);
                                } else {
                                    var sp = document.createElement('span'); sp.className = 'badge bg-red'; sp.textContent = String(unread); bellToggle.appendChild(sp);
                                }
                            } else {
                                if (badge) badge.remove();
                            }
                        } catch (err) { console.warn('poll notifications error', err); }
                    }
                    // poll immediately and then every 15 seconds
                    pollNotifications();
                    setInterval(pollNotifications, 15000);
                }
            } catch (e) { console.warn('polling setup failed', e); }
            dropdown.addEventListener('shown.bs.dropdown', async function () {
                try {
                    // prefer calling notify with explicit userId embedded server-side to avoid auth/token issues
                    var uid = bellToggle.getAttribute('data-user-id');
                    var url = '/AA/A0/AAA0_0104/notify';
                    if (uid && uid !== '') {
                        url += '?userId=' + encodeURIComponent(uid);
                    }
                    var res = await fetch(url, { credentials: 'same-origin' });
                    if (!res.ok) return;
                    var items = await res.json();
                    var listGroup = dropdown.querySelector('.list-group.list-group-flush');
                    if (!listGroup) return;
                    if (!items || items.length === 0) {
                        listGroup.innerHTML = '<div class="list-group-item"><div class="text-center text-secondary">Không có thông báo mới.</div></div>';
                        return;
                    }
                    var html = '';
                    for (var i = 0; i < Math.min(items.length, 5); i++) {
                        var n = items[i];
                        var isRead = (n.is_read == 1 || n.is_read === true);
                        var title = escapeHtml(n.title || '');
                        var msg = escapeHtml(n.message || '');
                        var created = escapeHtml(n.created_at || '');
                        var delivery = n.delivery_id || '';
                        var dotClass = isRead ? 'status-dot d-block' : 'status-dot status-dot-animated bg-red d-block';
                        html += '<div class="list-group-item">'
                            + '<div class="row align-items-center">'
                            + '<div class="col-auto"><span class="' + dotClass + '"></span></div>'
                            + '<div class="col text-truncate">'
                            + '<a href="/AA/A0/AAA0_0104/" class="text-body d-block">' + title + '</a>'
                            + '<div class="d-block text-secondary text-truncate mt-n1">' + msg + '</div>'
                            + '</div>'
                            + '<div class="col-auto">'
                            + '<a href="/AA/A0/AAA0_0104/mark/read?deliveryId=' + delivery + '" class="list-group-item-actions">Đánh dấu</a>'
                            + '</div>'
                            + '</div></div>';
                    }
                    listGroup.innerHTML = html;
                } catch (e) { console.error('notify fetch error', e); }
            });
        } catch (e) { console.error(e); }
        function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
        // Fallback: if Bootstrap dropdowns are not activating (conflicts), attach a safe click toggle
        try {
            var ddToggles = document.querySelectorAll('[data-bs-toggle="dropdown"]');
            ddToggles.forEach(function (t) {
                t.addEventListener('click', function (ev) {
                    try {
                        // If bootstrap available, use its API (prevents double handling)
                        if (window.bootstrap && bootstrap.Dropdown && typeof bootstrap.Dropdown.getOrCreateInstance === 'function') {
                            var inst = bootstrap.Dropdown.getOrCreateInstance(t);
                            inst.toggle();
                            return;
                        }
                        // Fallback manual toggle of classes
                        ev.preventDefault();
                        var parent = t.closest('.dropdown');
                        if (!parent) return;
                        var menu = parent.querySelector('.dropdown-menu');
                        var isShown = parent.classList.contains('show') || (menu && menu.classList.contains('show'));
                        if (isShown) {
                            parent.classList.remove('show');
                            if (menu) menu.classList.remove('show');
                        } else {
                            parent.classList.add('show');
                            if (menu) menu.classList.add('show');
                        }
                    } catch (err) { console.warn('dropdown toggle fallback', err); }
                });
            });
        } catch (err) { /* ignore */ }
        // Ensure /js/main.js is loaded (idempotent). Some pages render without the shared scripts.
        try {
            if (!document.querySelector('script[src*="/js/main.js"]')) {
                var s = document.createElement('script');
                s.src = '/js/main.js';
                s.defer = true;
                document.body.appendChild(s);
                console.debug('Injected /js/main.js from header fallback');
            }
        } catch (e) { console.warn('failed to ensure main.js', e); }
    });
</script>
