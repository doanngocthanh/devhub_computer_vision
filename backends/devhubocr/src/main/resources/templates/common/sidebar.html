    <div class="collapse navbar-collapse" id="sidebar-menu">
      <!-- BEGIN DYNAMIC NAVBAR MENU -->
      <ul class="navbar-nav pt-lg-3" id="sidebar-menu-list">
        <!-- Menu sẽ được load bằng JavaScript -->
        <li class="nav-item">
          <span class="nav-link text-muted">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            Đang tải menu...
          </span>
        </li>
      </ul>
      <!-- END DYNAMIC NAVBAR MENU -->

  <script>
    // Session Storage Keys
    const ACTIVE_MENU_KEY = 'active_menu_path';
    const ACTIVE_PARENT_KEY = 'active_parent_id';

    // Wait for DOM and Bootstrap to be ready
    function initSidebarMenu() {
      const menuList = document.getElementById('sidebar-menu-list');
      if (!menuList) {
        console.error('Menu list element not found');
        return;
      }

      fetch('/api/menu/sidebar')
        .then(response => response.json())
        .then(menus => {
          const activeMenuPath = sessionStorage.getItem(ACTIVE_MENU_KEY);
          const activeParentId = sessionStorage.getItem(ACTIVE_PARENT_KEY);

          menuList.innerHTML = renderMenusRecursive(menus, activeMenuPath, activeParentId, 1);

          // Reinitialize Bootstrap dropdowns
          if (typeof bootstrap !== 'undefined') {
            initializeAllDropdowns();
            openActiveDropdowns(activeParentId);
          }

          // Gắn sự kiện click và hover
          attachMenuClickEvents();
          attachNestedDropdownHover();
        })
        .catch(error => {
          console.error('Error loading menu:', error);
          menuList.innerHTML = '<li class="nav-item"><span class="nav-link text-danger">Lỗi tải menu</span></li>';
        });

      /**
       * Render menu đệ quy - hỗ trợ vô hạn cấp
       * @param {Array} menus - Danh sách menu
       * @param {string} activeMenuPath - Path của menu đang active
       * @param {number} activeParentId - ID của parent đang active
       * @param {number} level - Cấp độ hiện tại (1 = root)
       * @param {number} parentId - ID của menu cha
       */
      function renderMenusRecursive(menus, activeMenuPath, activeParentId, level = 1, parentId = null) {
        if (!menus || !Array.isArray(menus)) return '';

        return menus.map(menu => {
          const hasChildren = menu.children && Array.isArray(menu.children) && menu.children.length > 0;

          if (hasChildren) {
            return renderMenuWithChildren(menu, activeMenuPath, activeParentId, level, parentId);
          } else {
            return renderLeafMenu(menu, activeMenuPath, level, parentId);
          }
        }).join('');
      }

      /**
       * Render menu có children (dropdown)
       */
      function renderMenuWithChildren(menu, activeMenuPath, activeParentId, level, parentId) {
        const isActive = activeParentId == menu.id ? 'show' : '';
        const isExpanded = activeParentId == menu.id;

        // Render children đệ quy
        const childrenHtml = renderMenusRecursive(
          menu.children,
          activeMenuPath,
          activeParentId,
          level + 1,
          menu.id
        );

        // Level 1: Root menu trong sidebar
        if (level === 1) {
          const icon = renderIcon(menu.icon);
          return `
            <li class="nav-item dropdown">
              <button class="nav-link dropdown-toggle" 
                      type="button"
                      data-bs-toggle="dropdown" 
                      data-bs-auto-close="false" 
                      data-parent-id="${menu.id}"
                      data-menu-level="${level}"
                      aria-expanded="${isExpanded ? 'true' : 'false'}">
                ${icon}
                <span class="nav-link-title">${menu.title}</span>
              </button>
              <div class="dropdown-menu ${isActive}">
                ${childrenHtml}
              </div>
            </li>
          `;
        }
        // Level >= 2: Nested dropdown
        else {
          const icon = renderChildIcon(menu.icon);
          return `
            <div class="dropend">
              <a class="dropdown-item dropdown-toggle" 
                 href="javascript:void(0)" 
                 data-bs-toggle="dropdown"
                 data-bs-auto-close="false"
                 data-parent-id="${menu.id}"
                 data-menu-level="${level}"
                 data-grandparent-id="${parentId}"
                 role="button">
                ${icon}${menu.title}
              </a>
              <div class="dropdown-menu ${isActive}">
                ${childrenHtml}
              </div>
            </div>
          `;
        }
      }

      /**
       * Render menu không có children (leaf node)
       */
      function renderLeafMenu(menu, activeMenuPath, level, parentId) {
        const isActive = activeMenuPath === menu.path ? 'active' : '';
        const href = (menu.path && menu.path !== '' && menu.path !== '#')
          ? menu.path
          : 'javascript:void(0)';

        // Level 1: Root menu
        if (level === 1) {
          const icon = renderIcon(menu.icon);
          return `
            <li class="nav-item">
              <a class="nav-link ${isActive}" 
                 href="${href}"
                 data-menu-id="${menu.id}"
                 data-menu-path="${menu.path || ''}"
                 data-menu-level="${level}">
                ${icon}
                <span class="nav-link-title">${menu.title}</span>
              </a>
            </li>
          `;
        }
        // Level >= 2: Dropdown item
        else {
          const icon = renderChildIcon(menu.icon);
          return `
            <a class="dropdown-item ${isActive}" 
               href="${href}" 
               data-menu-id="${menu.id}"
               data-parent-id="${parentId}"
               data-menu-path="${menu.path || ''}"
               data-menu-level="${level}">
              ${icon}${menu.title}
            </a>
          `;
        }
      }

      /**
       * Render icon cho menu level 1
       */
      function renderIcon(iconName) {
        if (!iconName || iconName === 'null' || iconName === '') return '';
        const cleanIcon = iconName.replace(/^(fa-|fas-|far-|fab-)/i, '');
        if (cleanIcon === 'null') return '';

        return `
          <span class="nav-link-icon d-md-none d-lg-inline-block">
            <i class="fas fa-${cleanIcon}"></i>
          </span>
        `;
      }

      /**
       * Render icon cho dropdown item
       */
      function renderChildIcon(iconName) {
        if (!iconName || iconName === 'null' || iconName === '') return '';
        const cleanIcon = iconName.replace(/^(fa-|fas-|far-|fab-)/i, '');
        if (cleanIcon === 'null') return '';

        return `<i class="fas fa-${cleanIcon} me-2"></i>`;
      }

      /**
       * Khởi tạo tất cả Bootstrap dropdowns
       */
      function initializeAllDropdowns() {
        const dropdowns = document.querySelectorAll('#sidebar-menu-list [data-bs-toggle="dropdown"]');
        dropdowns.forEach(el => {
          try {
            new bootstrap.Dropdown(el);
          } catch (e) {
            console.warn('Could not initialize dropdown:', e);
          }
        });
      }

      /**
       * Mở các dropdown đang active
       */
      function openActiveDropdowns(activeParentId) {
        if (!activeParentId) return;

        // Tìm và mở tất cả dropdown parents của menu active
        const allDropdowns = document.querySelectorAll('[data-parent-id]');
        allDropdowns.forEach(dropdown => {
          const parentId = dropdown.getAttribute('data-parent-id');

          // Nếu là parent của active menu, mở nó
          if (parentId == activeParentId) {
            try {
              const dropdownMenu = dropdown.nextElementSibling;
              if (dropdownMenu && dropdownMenu.classList.contains('dropdown-menu')) {
                dropdownMenu.classList.add('show');
              }

              // Mở cả parent dropdown nếu có
              const parentDropdown = dropdown.closest('.dropdown-menu');
              if (parentDropdown) {
                parentDropdown.classList.add('show');
              }
            } catch (e) {
              console.warn('Could not open active dropdown:', e);
            }
          }
        });
      }

      /**
       * Gắn sự kiện click cho các menu items
       */
      function attachMenuClickEvents() {
        const menuLinks = document.querySelectorAll('#sidebar-menu-list a[data-menu-path]');

        menuLinks.forEach(link => {
          link.addEventListener('click', function (e) {
            const menuPath = this.getAttribute('data-menu-path');
            const menuId = this.getAttribute('data-menu-id');
            const parentId = this.getAttribute('data-parent-id');

            if (menuPath && menuPath !== '#' && menuPath !== '') {
              // Lưu vào session storage
              sessionStorage.setItem(ACTIVE_MENU_KEY, menuPath);

              if (parentId) {
                sessionStorage.setItem(ACTIVE_PARENT_KEY, parentId);
              } else {
                sessionStorage.removeItem(ACTIVE_PARENT_KEY);
              }

              // Xóa tất cả active hiện tại
              document.querySelectorAll('#sidebar-menu-list .nav-link, #sidebar-menu-list .dropdown-item')
                .forEach(el => el.classList.remove('active'));

              // Thêm active cho menu được click
              this.classList.add('active');
            }
          });
        });
      }

      /**
       * Gắn sự kiện hover cho nested dropdowns
       */
      function attachNestedDropdownHover() {
        const dropendItems = document.querySelectorAll('.dropend');

        dropendItems.forEach(dropend => {
          const menu = dropend.querySelector('.dropdown-menu');

          if (menu) {
            let timeoutId;

            // Hover vào dropend
            dropend.addEventListener('mouseenter', function () {
              clearTimeout(timeoutId);
              menu.classList.add('show');
            });

            // Rời khỏi dropend
            dropend.addEventListener('mouseleave', function () {
              timeoutId = setTimeout(() => {
                menu.classList.remove('show');
              }, 200);
            });

            // Giữ menu mở khi hover vào menu
            menu.addEventListener('mouseenter', function () {
              clearTimeout(timeoutId);
            });
          }
        });
      }
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSidebarMenu);
    } else {
      initSidebarMenu();
    }
  </script>
</aside>
<style>
  /* ===== RECURSIVE NESTED DROPDOWN SUPPORT ===== */

  /* Hỗ trợ nested dropdown đệ quy */
  .dropend {
    position: relative;
  }

  .dropend .dropdown-menu {
    position: absolute;
    top: 0;
    left: 100%;
    margin-top: 0;
    margin-left: 0.125rem;
    min-width: 200px;
  }

  /* Arrow cho nested dropdown */
  .dropend .dropdown-toggle::after {
    display: inline-block;
    margin-left: auto;
    vertical-align: 0.255em;
    content: "";
    border-top: 0.3em solid transparent;
    border-right: 0;
    border-bottom: 0.3em solid transparent;
    border-left: 0.3em solid;
  }

  /* Styling cho dropdown toggle items */
  .dropdown-item.dropdown-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-right: 2.5rem;
    position: relative;
  }

  /* Hiển thị dropdown khi hover */
  .dropend:hover>.dropdown-menu {
    display: block;
  }

  /* Hiển thị khi có class show */
  .dropend .dropdown-menu.show {
    display: block;
  }

  /* Z-index cho các cấp dropdown khác nhau */
  .dropdown-menu {
    z-index: 1050;
  }

  .dropend .dropdown-menu {
    z-index: 1051;
  }

  .dropend .dropend .dropdown-menu {
    z-index: 1052;
  }

  .dropend .dropend .dropend .dropdown-menu {
    z-index: 1053;
  }

  .dropend .dropend .dropend .dropend .dropdown-menu {
    z-index: 1054;
  }

  /* Đảm bảo nested dropdown không bị overflow */
  .navbar-vertical .dropdown-menu {
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }

  /* Indent cho các level khác nhau (tùy chọn) */
  .dropdown-item[data-menu-level="2"] {
    padding-left: 1rem;
  }

  .dropdown-item[data-menu-level="3"] {
    padding-left: 1.5rem;
  }

  .dropdown-item[data-menu-level="4"] {
    padding-left: 2rem;
  }

  .dropdown-item[data-menu-level="5"] {
    padding-left: 2.5rem;
  }

  /* Smooth transition cho dropdown */
  .dropdown-menu {
    transition: opacity 0.15s ease-in-out;
  }

  .dropdown-menu.show {
    opacity: 1;
  }

  /* Highlight cho active menu ở mọi level */
  .dropdown-item.active {
    background-color: var(--tblr-primary, #066fd1);
    color: white;
  }

  .dropdown-item.active i {
    color: white;
  }
</style>
