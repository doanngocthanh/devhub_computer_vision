<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Server error</title>
    <link rel="stylesheet" th:href="@{/css/tabler.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div th:replace="~{common/header :: header}"></div>
    <div class="container py-6">
      <div class="row justify-content-center">
        <div class="col-md-8 text-center">
          <h1 class="display-1">500</h1>
          <h2>Server error</h2>
          <p class="text-muted">An unexpected error occurred on the server.</p>
          <div th:if="${errorMessage}">
            <div class="alert alert-warning" th:text="${errorMessage}"></div>
          </div>
          <a class="btn btn-primary" th:href="@{/}">Return home</a>
        </div>
      </div>
    </div>
    <div th:replace="~{common/footer :: footer}"></div>
  </body>
</html>
