<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng ký - DevHub OCR</title>
    <link rel="stylesheet" th:href="@{/css/tabler.min.css}" />
    <link rel="stylesheet" th:href="@{/css/tabler-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .auth-wrapper { min-height: 100vh; display:flex; align-items:center; justify-content:center; }
        .auth-card { max-width: 520px; width:100%; }
    </style>
</head>
<body>
    <div class="auth-wrapper bg-light">
        <div class="auth-card">
            <div class="card">
                <div class="card-body p-4">
                    <h2 class="card-title">Tạo tài khoản</h2>
                    <p class="text-muted">Đăng ký tài khoản để sử dụng DevHub OCR</p>
                    <form method="post" action="#">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Họ</label>
                                <input type="text" name="firstName" class="form-control" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tên</label>
                                <input type="text" name="lastName" class="form-control" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" name="confirmPassword" class="form-control" required />
                        </div>
                        <div>
                            <button class="btn btn-primary">Tạo tài khoản</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3 text-muted small">Đã có tài khoản? <a href="/sign-in">Đăng nhập</a></div>
        </div>
    </div>

    <script th:src="@{/js/tabler.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
