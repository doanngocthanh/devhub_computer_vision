<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>User Managers (AAA0_0101)</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <div th:replace="/common/header :: header"></div>
    <div class="container">
      <h1>User Managers (AA.A0.AAA0_0101)</h1>
      <p>Assign or remove <strong>USER_MANAGER</strong> role to users.</p>

      <table>
        <thead><tr><th>Email</th><th>Name</th><th>Actions</th></tr></thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td th:text="${u.email}"></td>
            <td th:text="${u.first_name} + ' ' + ${u.last_name}"></td>
            <td>
              <form method="post" th:action="@{/AA/A0/AAA0_0101/user-managers/set}" style="display:inline">
                <input type="hidden" name="email" th:value="${u.email}" />
                <input type="hidden" name="action" value="add" />
                <button type="submit">Make manager</button>
              </form>
              <form method="post" th:action="@{/AA/A0/AAA0_0101/user-managers/set}" style="display:inline">
                <input type="hidden" name="email" th:value="${u.email}" />
                <input type="hidden" name="action" value="remove" />
                <button type="submit">Remove manager</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div th:replace="/common/footer :: footer"></div>
  </body>
  </html>
