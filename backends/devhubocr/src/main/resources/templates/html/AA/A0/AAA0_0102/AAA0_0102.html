<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAA0_0102 - Menu Management</title>
  <link rel="stylesheet" th:href="@{/css/tabler.min.css}" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body class="antialiased">

  <div class="page">
    <div th:replace="~{common/sidebar :: sidebar}"></div>
    <div class="page-wrapper">
      <div th:replace="~{common/header :: header}"></div>

      <div class="page-body">
        <div class="container-xl py-5">
          <div class="row g-4 mb-4">
            <div class="col-12">
              <h1 th:text="${pageTitle}">Menu Management</h1>

              <div class="row">
                <div class="col-12 col-lg-6">
                  <div class="card mb-3">
                    <div class="card-header">
                      <h3 class="card-title" th:text="${editMenu == null ? 'Create menu' : 'Edit menu'}"></h3>
                    </div>
                    <div class="card-body">
                      <form th:if="${editMenu == null}" method="post" th:action="@{/AA/A0/AAA0_0102/menu/create}">
                        <div class="mb-3">
                          <label class="form-label">Title</label>
                          <input name="title" class="form-control" placeholder="Menu title" required />
                        </div>

                        <div class="mb-3">
                          <label class="form-label">Icon</label>
                          <input name="icon" class="form-control" placeholder="e.g. home" list="icon-list" />
                          <datalist id="icon-list">
                            <option value="home"></option>
                            <option value="package"></option>
                            <option value="layout-2"></option>
                            <option value="settings"></option>
                          </datalist>
                        </div>

                        <div class="mb-3">
                          <label class="form-label">Path (URI)</label>
                          <input name="path" class="form-control" placeholder="/AA/A0/AAA0_0102/..." />
                        </div>

                        <div class="mb-3">
                          <label class="form-label">Parent</label>
                          <select name="parentId" class="form-select">
                            <option value="" th:text="'-- Top level --'"></option>
                            <option th:each="pm : ${allMenus}" th:value="${pm.id}" th:text="${pm.title}"></option>
                          </select>
                        </div>

                        <div class="mb-3">
                          <label class="form-label">Roles</label>
                          <select name="roles" class="form-select" multiple size="5">
                            <option th:each="r : ${allRoles}" th:value="${r.role}" th:text="${r.role}"></option>
                          </select>
                        </div>

                        <div class="d-flex gap-2">
                          <button type="submit" class="btn btn-primary">Create</button>
                          <a class="btn btn-link" th:href="@{/AA/A0/AAA0_0102/}">Reset</a>
                        </div>
                      </form>

                      <form th:if="${editMenu != null}" method="post" th:action="@{/AA/A0/AAA0_0102/menu/update}">
                        <input type="hidden" name="id" th:value="${editMenu.id}" />
                        <div class="mb-3">
                          <label class="form-label">Title</label>
                          <input name="title" class="form-control" th:value="${editMenu.title}" required />
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Icon</label>
                          <input name="icon" class="form-control" th:value="${editMenu.icon}" list="icon-list" />
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Path (URI)</label>
                          <input name="path" class="form-control" th:value="${editMenu.path}" />
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Parent</label>
                          <select name="parentId" class="form-select">
                            <option value="" th:text="'-- Top level --'"></option>
                            <option th:each="pm : ${allMenus}"
                                    th:value="${pm.id}"
                                    th:text="${pm.title}"
                                    th:selected="${editMenu.parent_id != null and pm.id == editMenu.parent_id}"></option>
                          </select>
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Roles</label>
                          <select name="roles" class="form-select" multiple size="5">
                            <option th:each="r : ${allRoles}"
                                    th:value="${r.role}"
                                    th:text="${r.role}"
                                    th:selected="${editRoles != null and #arrays.contains(editRoles, r.role)}"></option>
                          </select>
                        </div>
                        <div class="d-flex gap-2">
                          <button type="submit" class="btn btn-success">Save changes</button>
                          <a class="btn btn-link" th:href="@{/AA/A0/AAA0_0102/}">Cancel</a>
                        </div>
                      </form>

                    </div>
                  </div>
                </div>

                <div class="col-12 col-lg-6">
                  <div class="card mb-3">
                    <div class="card-header">
                      <h3 class="card-title">Existing menus</h3>
                    </div>
                    <div class="card-body">
                      <div class="table-responsive">
                        <table class="table table-vcenter">
                          <thead>
                            <tr>
                              <th>ID</th>
                              <th>Title</th>
                              <th>Icon</th>
                              <th>Path</th>
                              <th>Parent</th>
                              <th>Roles</th>
                              <th></th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr th:each="m : ${allMenus}">
                              <td th:text="${m.id}"></td>
                              <td th:text="${m.title}"></td>
                              <td th:text="${m.icon}"></td>
                              <td><code th:text="${m.path}"></code></td>
                              <td th:text="${m.parent_id}"></td>
                              <td th:text="${m.roles}"></td>
                              <td>
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/AA/A0/AAA0_0102/(editId=${m.id})}">Edit</a>
                                <form th:action="@{/AA/A0/AAA0_0102/menu/delete}" method="post" style="display:inline" onsubmit="return confirm('Are you sure you want to delete this menu item?');">
                                  <input type="hidden" name="id" th:value="${m.id}" />
                                  <button type="submit" class="btn btn-sm btn-danger ms-1">Delete</button>
                                </form>
                              </td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>

              </div>

            </div>
          </div>
        </div>
      </div>

      <div th:replace="~{common/footer :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/tabler.min.js}"></script>
  <script th:src="@{/js/main.js}"></script>
</body>

</html>
