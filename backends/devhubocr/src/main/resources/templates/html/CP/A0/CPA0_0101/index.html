<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CPA0_0101 - Preprocess OCR</title>
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
      /* small inline styles to keep page usable */
      .preview { max-width: 100%; border: 1px solid #ddd; }
      .regions { margin-top: 12px; }
      .region { padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
  <div class="container">
    <h2>CPA0_0101 — Preprocess (BoofCV) + Tess4J OCR</h2>
    <div>
      <label>Image file</label>
      <input id="file" type="file" accept="image/*" />
    </div>
    <div>
      <label>Language</label>
      <input id="lang" value="vie" />
    </div>
    <div>
      <button id="run">Run preprocess + OCR</button>
    </div>

    <div id="status"></div>

    <canvas id="canvas" class="preview"></canvas>

    <div class="regions" id="regions"></div>
  </div>

  <script>
    const fileEl = document.getElementById('file');
    const runBtn = document.getElementById('run');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const regionsEl = document.getElementById('regions');
    let currentFile;

    fileEl.addEventListener('change', (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      currentFile = f;
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0,0);
      };
      img.src = url;
    });

    runBtn.addEventListener('click', async () => {
      if (!currentFile) {
        status.innerText = 'Choose an image first';
        return;
      }
      status.innerText = 'Uploading...';
      const form = new FormData();
      form.append('file', currentFile);
      form.append('lang', document.getElementById('lang').value || 'vie');
      try {
        const res = await fetch('/CP/A0/CPA0_0101/upload-preprocess', { method: 'POST', body: form });
        const data = await res.json();
        if (!data.ok) {
          status.innerText = 'Error: ' + (data.error || JSON.stringify(data));
          return;
        }
        status.innerText = 'Done. Deskew: ' + data.deskewAngleDegrees + '°';
        regionsEl.innerHTML = '';
        const regions = data.regions || [];
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 2;
        regions.forEach(r => {
          const d = document.createElement('div');
          d.className = 'region';
          d.innerText = `x=${r.x}, y=${r.y}, w=${r.w}, h=${r.h}\n${r.text}`;
          regionsEl.appendChild(d);
          ctx.strokeRect(r.x, r.y, r.w, r.h);
        });
      } catch (e) {
        status.innerText = 'Upload failed: ' + e;
      }
    });
  </script>
</body>
</html>
