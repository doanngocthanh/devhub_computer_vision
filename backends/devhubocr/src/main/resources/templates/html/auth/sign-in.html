<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập - DevHub OCR</title>
    <link rel="stylesheet" th:href="@{/css/tabler.min.css}" />
    <link rel="stylesheet" th:href="@{/css/tabler-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .auth-wrapper { min-height: 100vh; display:flex; align-items:center; justify-content:center; }
        .auth-card { max-width: 420px; width:100%; }
    </style>
</head>
<body>
    <div class="auth-wrapper bg-light">
        <div class="auth-card">
            <div class="card">
                <div class="card-body p-4">
                    <h2 class="card-title">Đăng nhập</h2>
                    <p class="text-muted">Đăng nhập vào hệ thống DevHub OCR</p>
                    <form method="post" action="/auth/login">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="email@example.com" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required />
                        </div>
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <label class="form-check">
                                <input class="form-check-input" type="checkbox" />
                                <span class="form-check-label">Ghi nhớ đăng nhập</span>
                            </label>
                            <a href="/auth/sign-up" class="small">Tạo tài khoản</a>
                        </div>
                        <div>
                            <button class="btn btn-primary w-100">Đăng nhập</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3 text-muted small">© 2025 DevHub OCR</div>
        </div>
    </div>

    <script th:src="@{/js/tabler.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
