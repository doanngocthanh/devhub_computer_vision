spring.application.name=devhubocr

# Disable Spring Boot Docker Compose integration when compose file is empty
spring.docker.compose.enabled=false

# Reduce noisy warnings when a controller intentionally throws ResponseStatusException(404)
# Silence the specific resolver logger so "Resolved [org.springframework.web.server.ResponseStatusException: 404 NOT_FOUND \"Page not found\"]"
# does not spam logs. Keep other server logs intact.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseStatusExceptionResolver=ERROR

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
